<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="glow" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1c2029"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </radialGradient>
  </defs>

  <!-- badge principal -->
  <rect width="100" height="100" rx="22" fill="url(#glow)"/>
  <rect x="2.5" y="2.5" width="95" height="95" rx="19.5" fill="none" stroke="#22c55e" stroke-opacity="0.3" stroke-width="2"/>

  <!-- monogramme AS -->
  <text x="38" y="50" text-anchor="middle" dominant-baseline="middle"
        font-family="-apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="46" font-weight="800" fill="#22c55e" letter-spacing="-2">AS</text>

  <!-- pastille drapeau suisse, en accent dans le coin -->
  <rect x="56" y="56" width="38" height="38" rx="8" fill="#0f1115"/>
  <rect x="58.5" y="58.5" width="33" height="33" rx="6" fill="#D52B1E"/>
  <rect x="71" y="63.5" width="8" height="23" rx="1.5" fill="#ffffff"/>
  <rect x="63.5" y="71" width="23" height="8" rx="1.5" fill="#ffffff"/>
</svg>
