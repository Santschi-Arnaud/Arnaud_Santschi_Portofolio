<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="33%" stop-color="#1ea951"/>
      <stop offset="67%" stop-color="#156e35"/>
      <stop offset="100%" stop-color="#050806"/>
    </radialGradient>
  </defs>

  <!-- badge principal -->
  <rect width="100" height="100" rx="22" fill="url(#glow)"/>
  <rect x="2.5" y="2.5" width="95" height="95" rx="19.5" fill="none" stroke="#22c55e" stroke-opacity="0.3" stroke-width="2"/>

  <!-- monogramme AS, bien centre -->
  <text x="50" y="49" text-anchor="middle" dominant-baseline="middle"
        font-family="-apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-2">AS</text>

  <!-- petite pastille drapeau suisse, en accent discret dans le coin -->
  <rect x="69.5" y="69.5" width="24" height="24" rx="6" fill="#0f1115"/>
  <rect x="71.5" y="71.5" width="20" height="20" rx="4.5" fill="#D52B1E"/>
  <rect x="79" y="74.5" width="5" height="14" rx="1" fill="#ffffff"/>
  <rect x="74.5" y="79" width="14" height="5" rx="1" fill="#ffffff"/>
</svg>
